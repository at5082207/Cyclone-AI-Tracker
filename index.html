<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Cyclone Tracker AI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .header { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; background: white; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .chat-container { position: absolute; bottom: 20px; right: 20px; width: 320px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #000; color: white; padding: 12px; font-weight: bold; text-align: center; }
        .chat-box { height: 300px; padding: 10px; overflow-y: auto; font-size: 14px; background: #f4f4f9; display: flex; flex-direction: column; gap: 8px; }
        .chat-input-area { display: flex; border-top: 1px solid #ccc; }
        .chat-input-area input { flex: 1; padding: 12px; border: none; outline: none; }
        .chat-input-area button { padding: 12px 15px; background: #000; color: white; border: none; cursor: pointer; font-weight: bold; }
        .msg-ai { background: #e0e7ff; padding: 8px; border-radius: 8px; align-self: flex-start; max-width: 80%; }
        .msg-user { background: #d1fae5; padding: 8px; border-radius: 8px; align-self: flex-end; max-width: 80%; }
    </style>
</head>
<body>
    <div class="header"><h3>🌪️ AI Cyclone Tracker (SIH 2024)</h3></div>
    <div id="map"></div>

    <div class="chat-container">
        <div class="chat-header">🤖 AI Assistant</div>
        <div id="chat-box" class="chat-box">
            <div class="msg-ai"><b>AI:</b> Hello! Puchiye: 'Ye kitna nuksan karega aur kaha tak aayega?'</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type message..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20.0, 80.0], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

        fetch('/api/data')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data.data, {
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.name) {
                            // 1. Map Marker Popup update kiya hai
                            layer.bindPopup(
                                "<b>🌀 " + feature.properties.name + "</b><br>" +
                                "🚨 AI Risk Score: <b style='color:red'>" + feature.properties.ai_risk_score + "</b><br>" +
                                "⏳ ETA: <b>" + feature.properties.ai_eta + "</b>"
                            );

                            // 2. Future path ke liye Lal Rang ki dotted line banana
                            if (feature.properties.ai_future_path) {
                                L.polyline(feature.properties.ai_future_path, {
                                    color: 'red',
                                    weight: 4,
                                    dashArray: '10, 10' // Line ko dotted banata hai
                                }).addTo(map);
                            }
                        }
                    }
                }).addTo(map);
            });

        function sendMessage() {
            var input = document.getElementById('chat-input');
            var message = input.value;
            if (!message) return;
            
            var chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += '<div class="msg-user"><b>You:</b> ' + message + '</div>';
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: message })
            })
            .then(res => res.json())
            .then(data => {
                chatBox.innerHTML += '<div class="msg-ai"><b>AI:</b> ' + data.reply + '</div>';
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
